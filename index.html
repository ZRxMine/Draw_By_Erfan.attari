<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کانتر استرایک mini - Dust 2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* UI Overlays */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            color: #fff;
            font-family: monospace;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .score-box {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            gap: 20px;
        }

        .team-ct { color: #4a90e2; }
        .team-t { color: #e67e22; }

        .timer {
            font-size: 28px;
            color: #f1c40f;
            font-weight: bold;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            pointer-events: none;
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(0, 255, 0, 0.8);
        }

        #crosshair::before {
            top: 5px;
            left: 0;
            width: 12px;
            height: 2px;
        }

        #crosshair::after {
            top: 0;
            left: 5px;
            width: 2px;
            height: 12px;
        }

        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .stats-group {
            display: flex;
            gap: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 28px;
            font-weight: bold;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ammo-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 32px;
            font-weight: bold;
            color: #f39c12;
            text-align: right;
        }

        #reloading-text {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #e74c3c;
            font-weight: bold;
            display: none;
        }

        #kill-feed {
            position: absolute;
            top: 80px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: flex-end;
        }

        .kill-message {
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            border-right: 4px solid #e74c3c;
            animation: fadeOut 5s forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Modal / Menu */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 20, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
        }

        .modal h1 {
            font-size: 48px;
            margin-bottom: 10px;
            letter-spacing: 2px;
            color: #f39c12;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
        }

        .modal p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #aaa;
        }

        .team-select {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
        }

        .btn-team {
            width: 220px;
            height: 140px;
            border: 2px solid transparent;
            border-radius: 12px;
            background: #222;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            pointer-events: auto;
        }

        .btn-team:hover {
            transform: translateY(-5px);
        }

        .btn-ct {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border-color: #4a90e2;
        }

        .btn-t {
            background: linear-gradient(135deg, #8e2de2, #4a00e0);
            background: linear-gradient(135deg, #b79891, #94716b);
            background: linear-gradient(135deg, #d35400, #e67e22);
            border-color: #f39c12;
        }

        .controls-info {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 30px;
            border-radius: 8px;
            text-align: center;
            line-height: 1.6;
            color: #ccc;
            font-size: 14px;
        }

        /* Radar Minimap */
        #radar {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 140px;
            height: 140px;
            background: rgba(0, 20, 0, 0.6);
            border: 2px solid rgba(0, 255, 0, 0.4);
            border-radius: 50%;
            overflow: hidden;
        }

        #radar-canvas {
            width: 100%;
            height: 100%;
        }

        /* */
        .touch-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            z-index: 50;
            backdrop-filter: blur(4px);
            pointer-events: auto;
        }

        .touch-btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }

        #fire-btn {
            bottom: 40px;
            right: 30px;
            width: 75px;
            height: 75px;
            background: rgba(231, 76, 60, 0.7);
            border-color: #e74c3c;
            font-size: 24px;
        }

        #jump-btn {
            bottom: 130px;
            right: 35px;
            width: 55px;
            height: 55px;
            background: rgba(52, 152, 219, 0.6);
            border-color: #3498db;
            font-size: 16px;
        }

        #zoom-btn {
            bottom: 125px;
            right: 105px;
            width: 55px;
            height: 55px;
            background: rgba(155, 89, 182, 0.6);
            border-color: #9b59b6;
            font-size: 16px;
        }

        #reload-btn {
            bottom: 40px;
            right: 120px;
            width: 55px;
            height: 55px;
            background: rgba(241, 196, 15, 0.6);
            border-color: #f1c40f;
            font-size: 18px;
        }

        /* Joystick Base & Knob */
        #joystick-container {
            position: absolute;
            bottom: 40px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            touch-action: none;
            pointer-events: auto;
            z-index: 50;
        }

        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        #touch-look-area {
            position: absolute;
            top: 0;
            right: 0;
            width: 65%;
            height: 100%;
            touch-action: none;
            pointer-events: auto;
            z-index: 10;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div id="hud">
            <div id="radar">
                <canvas id="radar-canvas" width="140" height="140"></canvas>
            </div>

            <div class="top-bar" style="margin: 0 auto; width: 350px;">
                <div class="score-box">
                    <span class="team-ct" id="score-ct">CT: 0</span>
                    <span>-</span>
                    <span class="team-t" id="score-t">T: 0</span>
                </div>
                <div class="timer" id="round-timer">02:00</div>
            </div>

            <div id="crosshair"></div>
            <div id="reloading-text">در حال تعویض خشاب (R)...</div>

            <div id="kill-feed"></div>

            <!-- -->
            <div id="touch-controls">
                <div id="joystick-container">
                    <div id="joystick-knob"></div>
                </div>
                <div id="touch-look-area"></div>
                <div id="fire-btn" class="touch-btn">💥</div>
                <div id="jump-btn" class="touch-btn">⬆</div>
                <div id="zoom-btn" class="touch-btn">🔍</div>
                <div id="reload-btn" class="touch-btn">↻</div>
            </div>

            <div class="bottom-bar">
                <div class="stats-group">
                    <div class="stat-item" style="color: #e74c3c;">
                        <span>+</span>
                        <span id="health-val">100</span>
                    </div>
                    <div class="stat-item" style="color: #3498db;">
                        <span>🛡</span>
                        <span id="armor-val">100</span>
                    </div>
                </div>

                <div class="ammo-box">
                    <span id="ammo-clip">30</span> / <span id="ammo-reserve">90</span>
                </div>
            </div>
        </div>

        <!-- Start/Death Screen -->
        <div id="start-modal" class="modal">
            <h1>کانتر استرایک - DUST 2</h1>
            <p>تیم خود را برای شروع بازی انتخاب کنید (۶ در برابر ۶)</p>
            
            <div class="team-select">
                <button class="btn-team btn-ct" onclick="selectTeam('CT')">
                    <span>ضد تروریست (CT)</span>
                    <small style="font-weight: normal; font-size: 13px;">دفاع از A و B</small>
                </button>
                <button class="btn-team btn-t" onclick="selectTeam('T')">
                    <span>تروریست (T)</span>
                    <small style="font-weight: normal; font-size: 13px;">حمله به A و B</small>
                </button>
            </div>

            <div class="controls-info">
                <b>راهنمای کلیدها:</b><br>
                حرکت: W, A, S, D | پرش: Space<br>
                شلیک: کلیک چپ موس | زوم: کلیک راست<br>
                تعویض تیر (Reload): کلید R | قفل موس: کلیک روی صفحه
            </div>
        </div>
    </div>

    <script>
        // --- تنظیمات و متغیرهای اصلی ---
        let scene, camera, renderer;
        let player = {
            height: 1.7,
            speed: 0.12,
            jumpForce: 0.18,
            velocity: new THREE.Vector3(),
            health: 100,
            armor: 100,
            team: 'CT',
            onGround: false,
            ammoClip: 30,
            clipSize: 30,
            ammoReserve: 90,
            isReloading: false,
            kills: 0,
            deaths: 0
        };

        let touchControls = {
            joystickActive: false,
            joystickTouchId: null,
            joystickStart: { x: 0, y: 0 },
            joystickMove: { x: 0, y: 0 },
            lookTouchId: null,
            lookStart: { x: 0, y: 0 },
            fireInterval: null
        };

        let keys = {};
        let mouseLook = { yaw: 0, pitch: 0 };
        let isGameStarted = false;
        let roundTime = 120;
        let timerInterval;

        let ctScore = 0;
        let tScore = 0;

        // آرایه‌های فیزیک و اشیاء
        let collidableObjects = []; // دیوارهای فیزیکی
        let bots = [];
        let bullets = [];
        let muzzleFlashes = [];

        // نقشه Dust2 (دیوارها و جعبه‌ها)
        const MAP_BOUNDS = 120;

        // --- راه‌اندازی اولیه Three.js ---
        function initEngine() {
            const container = document.getElementById('game-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xdce7f0); // آسمان روشن صحرایی
            scene.fog = new THREE.FogExp2(0xdce7f0, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // نورپردازی
            const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
            sunLight.position.set(50, 100, 30);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 1024;
            sunLight.shadow.mapSize.height = 1024;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 250;
            const d = 80;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // ساخت نقشه Dust2
            buildDust2Map();

            // ساخت اسلحه بازیکن
            createPlayerGun();

            initTouchControls();

            // رویدادهای ورودی
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', e => keys[e.code] = true);
            document.addEventListener('keyup', e => keys[e.code] = false);

            document.addEventListener('click', () => {
                if (isGameStarted && document.pointerLockElement !== document.body) {
                    document.body.requestPointerLock();
                }
            });

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mousedown', onMouseDown);

            // حلقه اصلی بازی
            animate();
        }

        // --- ساخت نقشه Dust 2 ---
        function buildDust2Map() {
            // متریال‌ها
            const sandTexture = createColorTexture('#d2b48c');
            const wallTexture = createColorTexture('#c2a649');
            const crateTexture = createColorTexture('#8b5a2b');
            const siteATexture = createColorTexture('#a33');
            const siteBTexture = createColorTexture('#33a');

            const floorMat = new THREE.MeshStandardMaterial({ color: 0xdfbf9f, roughness: 0.9 });
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xd8be91, roughness: 0.8 });
            const crateMat = new THREE.MeshStandardMaterial({ color: 0x966f33, roughness: 0.6 });

            // زمین اصلی
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // دیوارهای خارجی نقشه
            createWall(0, 5, -80, 160, 10, 2, wallMat); // شمال
            createWall(0, 5, 80, 160, 10, 2, wallMat);  // جنوب
            createWall(-80, 5, 0, 2, 10, 160, wallMat); // غرب
            createWall(80, 5, 0, 2, 10, 160, wallMat);  // شرق

            // --- ساختارهای اصلی Dust2 ---

            // سایت A (بالا سمت راست / شمال شرق)
            createWall(40, 3, -50, 30, 6, 2, wallMat);
            createCrate(45, 1.5, -45, 3, 3, 3, crateMat);
            createCrate(50, 1.5, -45, 3, 3, 3, crateMat);
            createCrate(47, 4.5, -45, 3, 3, 3, crateMat);
            createSiteZone(50, 0.01, -50, 15, 'A');

            // Long A (مسیر مستقیم سمت راست)
            createWall(65, 5, 0, 2, 10, 80, wallMat); // دیواره Long

            // سایت B (بالا سمت چپ / شمال غرب)
            createWall(-50, 5, -40, 40, 10, 2, wallMat); // دیواره پشتی B
            createWall(-30, 5, -55, 2, 10, 30, wallMat);
            createCrate(-55, 1.5, -55, 3, 3, 3, crateMat);
            createCrate(-50, 1.5, -58, 3, 3, 3, crateMat);
            createSiteZone(-50, 0.01, -55, 15, 'B');

            // تونل B (مسیر تاریک)
            createWall(-50, 5, 0, 2, 10, 50, wallMat);
            createWall(-65, 5, 10, 2, 10, 50, wallMat);

            // Mid (وسط)
            createWall(0, 5, 10, 2, 10, 60, wallMat); // دیواره وسط
            createWall(15, 5, -20, 30, 10, 2, wallMat); // Mid Doors Area

            // جعبه‌های مختلف برای کاور
            createCrate(0, 1.5, 30, 3, 3, 3, crateMat);
            createCrate(5, 1.5, 30, 3, 3, 3, crateMat);
            createCrate(-10, 1.5, -10, 4, 4, 4, crateMat);
            createCrate(20, 1.5, 40, 3, 3, 3, crateMat);
            createCrate(55, 1.5, 10, 4, 4, 4, crateMat);
            createCrate(-40, 1.5, 20, 3, 3, 3, crateMat);
        }

        function createWall(x, y, z, w, h, d, material) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            // ساخت Bounding Box برای برخورد تیر و بازیکن
            const box = new THREE.Box3().setFromObject(mesh);
            collidableObjects.push({ mesh: mesh, box: box, type: 'wall' });
        }

        function createCrate(x, y, z, w, h, d, material) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const box = new THREE.Box3().setFromObject(mesh);
            collidableObjects.push({ mesh: mesh, box: box, type: 'crate' });
        }

        function createSiteZone(x, y, z, size, name) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = name === 'A' ? '#e74c3c' : '#3498db';
            ctx.font = 'Bold 80px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(name, 64, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const geo = new THREE.PlaneGeometry(size, size);
            const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, opacity: 0.6 });
            const zone = new THREE.Mesh(geo, mat);
            zone.rotation.x = -Math.PI / 2;
            zone.position.set(x, y, z);
            scene.add(zone);
        }

        function createColorTexture(colorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = colorHex;
            ctx.fillRect(0, 0, 16, 16);
            return new THREE.CanvasTexture(canvas);
        }

        // --- تفنگ بازیکن ---
        let gunGroup;
        function createPlayerGun() {
            gunGroup = new THREE.Group();

            // بدنه اسلحه (AK47 / M4)
            const bodyGeo = new THREE.BoxGeometry(0.08, 0.12, 0.5);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.3 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            gunGroup.add(body);

            // لوله تفنگ
            const barrelGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.4);
            const barrel = new THREE.Mesh(barrelGeo, bodyMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0, 0.02, -0.4);
            gunGroup.add(barrel);

            // خشاب
            const magGeo = new THREE.BoxGeometry(0.04, 0.18, 0.08);
            const magMat = new THREE.MeshStandardMaterial({ color: 0x554433 });
            const mag = new THREE.Mesh(magGeo, magMat);
            mag.position.set(0, -0.1, -0.1);
            mag.rotation.x = 0.2;
            gunGroup.add(mag);

            gunGroup.position.set(0.2, -0.2, -0.4);
            camera.add(gunGroup);
            scene.add(camera);
        }

        // --- ساخت ربات‌ها (AI) ---
        function spawnBots() {
            // پاکسازی ربات‌های قبلی
            bots.forEach(b => scene.remove(b.mesh));
            bots = [];

            // نقاط اسپاون مشخص
            // CT Spawn: انتهای نقشه (جنوب/شرق)
            // T Spawn: ابتدای نقشه (شمال/غرب)
            const ctSpawns = [
                { x: 10, z: 60 }, { x: 15, z: 60 }, { x: 20, z: 60 },
                { x: 10, z: 65 }, { x: 15, z: 65 }, { x: 20, z: 65 }
            ];

            const tSpawns = [
                { x: -50, z: 60 }, { x: -55, z: 60 }, { x: -60, z: 60 },
                { x: -50, z: 65 }, { x: -55, z: 65 }, { x: -60, z: 65 }
            ];

            // اسپاون بازیکن اصلی
            if (player.team === 'CT') {
                const pSpawn = ctSpawns.pop();
                camera.position.set(pSpawn.x, player.height, pSpawn.z);
            } else {
                const pSpawn = tSpawns.pop();
                camera.position.set(pSpawn.x, player.height, pSpawn.z);
            }

            // ساخت ۵ یار خودی + ۶ دشمن
            ctSpawns.forEach((sp, idx) => {
                if (player.team !== 'CT' || idx < 5) {
                    createBot('CT', sp.x, sp.z);
                }
            });

            tSpawns.forEach((sp, idx) => {
                if (player.team !== 'T' || idx < 5) {
                    createBot('T', sp.x, sp.z);
                }
            });
        }

        function createBot(team, x, z) {
            const group = new THREE.Group();

            // رنگ لباس: CT آبی، T قهوه‌ای/قرمز
            const color = team === 'CT' ? 0x2980b9 : 0xd35400;
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 });
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });

            // بدن
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.4, 8), bodyMat);
            body.position.y = 0.7;
            body.castShadow = true;
            group.add(body);

            // سر
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), headMat);
            head.position.y = 1.6;
            head.castShadow = true;
            group.add(head);

            // تفنگ ربات
            const gun = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.6), new THREE.MeshBasicMaterial({ color: 0x111111 }));
            gun.position.set(0.2, 1.1, -0.3);
            group.add(gun);

            group.position.set(x, 0, z);
            scene.add(group);

            bots.push({
                mesh: group,
                team: team,
                health: 100,
                target: null,
                lastShootTime: 0,
                speed: 0.06 + Math.random() * 0.03,
                changeDirTimer: 0,
                moveDir: new THREE.Vector3()
            });
        }

        // --- شروع بازی / انتخاب تیم ---
        function selectTeam(selectedTeam) {
            player.team = selectedTeam;
            document.getElementById('start-modal').style.display = 'none';

            try {
                if (!('ontouchstart' in window || navigator.maxTouchPoints > 0)) {
                    document.body.requestPointerLock();
                }
            } catch(e) {
                console.log('Pointer lock error:', e);
            }

            isGameStarted = true;
            resetRound();
        }

        function resetRound() {
            player.health = 100;
            player.armor = 100;
            player.ammoClip = player.clipSize;
            player.ammoReserve = 90;
            player.isReloading = false;
            updateHUD();

            spawnBots();

            roundTime = 120;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isGameStarted) return;
                roundTime--;
                const m = Math.floor(roundTime / 60).toString().padStart(2, '0');
                const s = (roundTime % 60).toString().padStart(2, '0');
                const timerEl = document.getElementById('round-timer');
                if (timerEl) timerEl.innerText = `${m}:${s}`;

                if (roundTime <= 0) {
                    endRound('زمان به پایان رسید - CT برنده شد!');
                }
            }, 1000);
        }

        function endRound(reasonMessage) {
            isGameStarted = false;
            clearInterval(timerInterval);
            
            showKillFeed(reasonMessage);

            setTimeout(() => {
                const modal = document.getElementById('start-modal');
                if (modal) modal.style.display = 'flex';
            }, 2500);
        }

        function initTouchControls() {
            const joystick = document.getElementById('joystick-container');
            const knob = document.getElementById('joystick-knob');
            const lookArea = document.getElementById('touch-look-area');

            if (!joystick || !lookArea) return;

            joystick.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                touchControls.joystickActive = true;
                touchControls.joystickTouchId = touch.identifier;
                const rect = joystick.getBoundingClientRect();
                touchControls.joystickStart = {
                    x: rect.left + rect.width / 2,
                    y: rect.top + rect.height / 2
                };
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];

                    if (touchControls.joystickActive && touch.identifier === touchControls.joystickTouchId) {
                        const dx = touch.clientX - touchControls.joystickStart.x;
                        const dy = touch.clientY - touchControls.joystickStart.y;
                        const dist = Math.min(Math.hypot(dx, dy), 40);
                        const angle = Math.atan2(dy, dx);

                        const knobX = Math.cos(angle) * dist;
                        const knobY = Math.sin(angle) * dist;

                        if (knob) knob.style.transform = `translate(${knobX}px, ${knobY}px)`;

                        touchControls.joystickMove = {
                            x: knobX / 40,
                            y: knobY / 40
                        };
                    }

                    if (touch.identifier === touchControls.lookTouchId) {
                        const dx = touch.clientX - touchControls.lookStart.x;
                        const dy = touch.clientY - touchControls.lookStart.y;

                        const sensitivity = 0.005;
                        mouseLook.yaw -= dx * sensitivity;
                        mouseLook.pitch -= dy * sensitivity;
                        mouseLook.pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, mouseLook.pitch));

                        touchControls.lookStart = { x: touch.clientX, y: touch.clientY };
                    }
                }
            }, { passive: false });

            const resetJoystick = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === touchControls.joystickTouchId) {
                        touchControls.joystickActive = false;
                        touchControls.joystickTouchId = null;
                        touchControls.joystickMove = { x: 0, y: 0 };
                        if (knob) knob.style.transform = `translate(0px, 0px)`;
                    }
                    if (touch.identifier === touchControls.lookTouchId) {
                        touchControls.lookTouchId = null;
                    }
                }
            };

            window.addEventListener('touchend', resetJoystick);
            window.addEventListener('touchcancel', resetJoystick);

            lookArea.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                if (touchControls.lookTouchId === null) {
                    touchControls.lookTouchId = touch.identifier;
                    touchControls.lookStart = { x: touch.clientX, y: touch.clientY };
                }
            }, { passive: false });

            const fireBtn = document.getElementById('fire-btn');
            const jumpBtn = document.getElementById('jump-btn');
            const zoomBtn = document.getElementById('zoom-btn');
            const reloadBtn = document.getElementById('reload-btn');

            if (fireBtn) {
                fireBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    shootWeapon();
                    if (!touchControls.fireInterval) {
                        touchControls.fireInterval = setInterval(() => {
                            shootWeapon();
                        }, 160);
                    }
                }, { passive: false });

                fireBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    if (touchControls.fireInterval) {
                        clearInterval(touchControls.fireInterval);
                        touchControls.fireInterval = null;
                    }
                }, { passive: false });
            }

            if (jumpBtn) {
                jumpBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (player.onGround) {
                        player.velocity.y = player.jumpForce;
                        player.onGround = false;
                    }
                }, { passive: false });
            }

            if (zoomBtn) {
                zoomBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (camera.fov === 75) {
                        camera.fov = 40;
                    } else {
                        camera.fov = 75;
                    }
                    camera.updateProjectionMatrix();
                }, { passive: false });
            }

            if (reloadBtn) {
                reloadBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    reloadWeapon();
                }, { passive: false });
            }
        }

        function onMouseMove(e) {
            if (document.pointerLockElement !== document.body) return;

            const sensitivity = 0.0022;
            mouseLook.yaw -= e.movementX * sensitivity;
            mouseLook.pitch -= e.movementY * sensitivity;

            mouseLook.pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, mouseLook.pitch));
        }

        function onMouseDown(e) {
            if (!isGameStarted || document.pointerLockElement !== document.body) return;

            if (e.button === 0) {
                shootWeapon();
            } else if (e.button === 2) {
                if (camera.fov === 75) {
                    camera.fov = 40;
                } else {
                    camera.fov = 75;
                }
                camera.updateProjectionMatrix();
            }
        }

        function shootWeapon() {
            if (player.isReloading || player.ammoClip <= 0) {
                if (player.ammoClip <= 0) reloadWeapon();
                return;
            }

            player.ammoClip--;
            updateHUD();

            if (gunGroup) {
                gunGroup.position.z = -0.35;
                setTimeout(() => { if (gunGroup) gunGroup.position.z = -0.4; }, 50);
            }

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            createBullet(camera.position, raycaster.ray.direction, player.team, true);

            playGunshotSound();

            if (player.ammoClip === 0) {
                reloadWeapon();
            }
        }

        function reloadWeapon() {
            if (player.isReloading || player.ammoReserve <= 0 || player.ammoClip === player.clipSize) return;

            player.isReloading = true;
            const reloadText = document.getElementById('reloading-text');
            if (reloadText) reloadText.style.display = 'block';

            if (gunGroup) gunGroup.rotation.x = -0.5;

            setTimeout(() => {
                const needed = player.clipSize - player.ammoClip;
                const added = Math.min(needed, player.ammoReserve);

                player.ammoClip += added;
                player.ammoReserve -= added;
                player.isReloading = false;

                if (gunGroup) gunGroup.rotation.x = 0;
                if (reloadText) reloadText.style.display = 'none';
                updateHUD();
            }, 1800);
        }

        function createBullet(origin, direction, team, isPlayer = false) {
            const dir = direction.clone().normalize();
            
            const geo = new THREE.SphereGeometry(0.05, 4, 4);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            const mesh = new THREE.Mesh(geo, mat);
            
            mesh.position.copy(origin).add(dir.clone().multiplyScalar(0.5));
            scene.add(mesh);

            bullets.push({
                mesh: mesh,
                dir: dir,
                speed: 2.5,
                life: 60,
                team: team,
                isPlayer: isPlayer
            });
        }

        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                const prevPos = b.mesh.position.clone();
                b.mesh.position.add(b.dir.clone().multiplyScalar(b.speed));
                b.life--;

                let hitWall = false;
                const bulletRay = new THREE.Raycaster(prevPos, b.dir, 0, b.speed);
                const wallObjects = collidableObjects.map(c => c.mesh);
                const wallHits = bulletRay.intersectObjects(wallObjects);

                if (wallHits.length > 0) {
                    hitWall = true;
                    createImpactEffect(wallHits[0].point);
                }

                if (hitWall) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                    continue;
                }

                if (!b.isPlayer && b.team !== player.team) {
                    const distToPlayer = b.mesh.position.distanceTo(camera.position);
                    if (distToPlayer < 0.8) {
                        damagePlayer(25);
                        scene.remove(b.mesh);
                        bullets.splice(i, 1);
                        continue;
                    }
                }

                let hitBot = false;
                for (let j = bots.length - 1; j >= 0; j--) {
                    const bot = bots[j];
                    if (bot.team !== b.team) {
                        const dist = b.mesh.position.distanceTo(bot.mesh.position.clone().add(new THREE.Vector3(0, 0.8, 0)));
                        if (dist < 0.7) {
                            hitBot = true;
                            bot.health -= 35;

                            createImpactEffect(b.mesh.position);

                            if (bot.health <= 0) {
                                if (b.isPlayer) player.kills++;
                                showKillFeed(`${b.isPlayer ? 'شما' : b.team} یک ${bot.team} را کشت!`);
                                scene.remove(bot.mesh);
                                bots.splice(j, 1);

                                checkRoundEndConditions();
                            }
                            break;
                        }
                    }
                }

                if (hitBot || b.life <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }
        }

        function createImpactEffect(pos) {
            const pGeo = new THREE.SphereGeometry(0.08, 4, 4);
            const pMat = new THREE.MeshBasicMaterial({ color: 0x555555 });
            const p = new THREE.Mesh(pGeo, pMat);
            p.position.copy(pos);
            scene.add(p);
            setTimeout(() => scene.remove(p), 500);
        }

        function damagePlayer(amount) {
            player.health -= amount;
            if (player.health < 0) player.health = 0;
            updateHUD();

            const hud = document.getElementById('hud');
            if (hud) {
                hud.style.backgroundColor = 'rgba(255, 0, 0, 0.2)';
                setTimeout(() => hud.style.backgroundColor = 'transparent', 150);
            }

            if (player.health <= 0) {
                player.deaths++;
                endRound('شما کشته شدید!');
            }
        }

        function updateBotsAI() {
            bots.forEach(bot => {
                let closestEnemyPos = null;
                let minDist = 999;

                if (bot.team !== player.team && player.health > 0) {
                    const dist = bot.mesh.position.distanceTo(camera.position);
                    if (dist < minDist) {
                        minDist = dist;
                        closestEnemyPos = camera.position.clone();
                    }
                }

                bots.forEach(otherBot => {
                    if (otherBot.team !== bot.team) {
                        const dist = bot.mesh.position.distanceTo(otherBot.mesh.position);
                        if (dist < minDist) {
                            minDist = dist;
                            closestEnemyPos = otherBot.mesh.position.clone();
                        }
                    }
                });

                if (closestEnemyPos && minDist < 45) {
                    bot.mesh.lookAt(closestEnemyPos.x, bot.mesh.position.y, closestEnemyPos.z);

                    const now = Date.now();
                    if (minDist < 30 && now - bot.lastShootTime > 600 + Math.random() * 400) {
                        bot.lastShootTime = now;
                        const shootDir = closestEnemyPos.clone().sub(bot.mesh.position).normalize();
                        shootDir.x += (Math.random() - 0.5) * 0.1;
                        shootDir.z += (Math.random() - 0.5) * 0.1;
                        createBullet(bot.mesh.position.clone().add(new THREE.Vector3(0, 1.2, 0)), shootDir, bot.team, false);
                    }

                    if (minDist > 8) {
                        const moveVec = closestEnemyPos.clone().sub(bot.mesh.position).normalize().multiplyScalar(bot.speed);
                        moveEntityWithCollision(bot.mesh, moveVec, 0.5);
                    }
                } else {
                    if (Date.now() > bot.changeDirTimer) {
                        bot.changeDirTimer = Date.now() + 2000 + Math.random() * 3000;
                        const angle = Math.random() * Math.PI * 2;
                        bot.moveDir.set(Math.cos(angle), 0, Math.sin(angle));
                    }
                    bot.mesh.rotation.y = Math.atan2(bot.moveDir.x, bot.moveDir.z);
                    moveEntityWithCollision(bot.mesh, bot.moveDir.clone().multiplyScalar(bot.speed), 0.5);
                }
            });
        }

        function checkRoundEndConditions() {
            const ctAlive = bots.filter(b => b.team === 'CT').length + (player.team === 'CT' && player.health > 0 ? 1 : 0);
            const tAlive = bots.filter(b => b.team === 'T').length + (player.team === 'T' && player.health > 0 ? 1 : 0);

            if (ctAlive === 0) {
                tScore++;
                endRound('تروریست‌ها (T) برنده شدند!');
            } else if (tAlive === 0) {
                ctScore++;
                endRound('ضد تروریست‌ها (CT) برنده شدند!');
            }
        }

        function moveEntityWithCollision(entityMesh, moveVector, radius) {
            const targetPos = entityMesh.position.clone().add(moveVector);

            for (let obj of collidableObjects) {
                const expandedBox = obj.box.clone().expandByScalar(radius);
                if (expandedBox.containsPoint(targetPos)) {
                    return; 
                }
            }

            if (Math.abs(targetPos.x) > MAP_BOUNDS || Math.abs(targetPos.z) > MAP_BOUNDS) return;

            entityMesh.position.copy(targetPos);
        }

        // --- بروزرسانی حرکت بازیکن ---
        function updatePlayerMovement() {
            if (!isGameStarted) return;

            // کلید R برای تعویض خشاب
            if (keys['KeyR']) {
                reloadWeapon();
            }

            const moveDir = new THREE.Vector3();
            const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), mouseLook.yaw);
            const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), mouseLook.yaw);

            // کیبورد
            if (keys['KeyW']) moveDir.add(forward);
            if (keys['KeyS']) moveDir.sub(forward);
            if (keys['KeyD']) moveDir.add(side);
            if (keys['KeyA']) moveDir.sub(side);

            // جوئی‌استیک لمسی (موبایل)
            if (touchControls.joystickMove.x !== 0 || touchControls.joystickMove.y !== 0) {
                const joyX = touchControls.joystickMove.x;
                const joyY = touchControls.joystickMove.y;

                moveDir.add(forward.clone().multiplyScalar(-joyY));
                moveDir.add(side.clone().multiplyScalar(joyX));
            }

            if (moveDir.length() > 0) {
                moveDir.normalize().multiplyScalar(player.speed);

                // فیزیک برخورد بازیکن با دیوارها
                const nextPos = camera.position.clone().add(moveDir);
                let canMove = true;

                for (let obj of collidableObjects) {
                    const expandedBox = obj.box.clone().expandByScalar(0.4); // شعاع بدن بازیکن
                    if (expandedBox.containsPoint(new THREE.Vector3(nextPos.x, 1, nextPos.z))) {
                        canMove = false;
                        break;
                    }
                }

                if (canMove) {
                    camera.position.x = nextPos.x;
                    camera.position.z = nextPos.z;
                }
            }

            // پرش ساده
            if (keys['Space'] && player.onGround) {
                player.velocity.y = player.jumpForce;
                player.onGround = false;
            }

            // جاذبه زمین
            camera.position.y += player.velocity.y;
            if (camera.position.y > player.height) {
                player.velocity.y -= 0.01; // Gravity
            } else {
                camera.position.y = player.height;
                player.velocity.y = 0;
                player.onGround = true;
            }
        }

        // --- افکت‌های صوتی ---
        function playGunshotSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);

                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e){}
        }

        // --- بروزرسانی HUD و رادار ---
        function updateHUD() {
            document.getElementById('health-val').innerText = Math.max(0, Math.round(player.health));
            document.getElementById('armor-val').innerText = player.armor;
            document.getElementById('ammo-clip').innerText = player.ammoClip;
            document.getElementById('ammo-reserve').innerText = player.ammoReserve;

            document.getElementById('score-ct').innerText = `CT: ${ctScore}`;
            document.getElementById('score-t').innerText = `T: ${tScore}`;
        }

        function updateRadar() {
            const radarCanvas = document.getElementById('radar-canvas');
            const ctx = radarCanvas.getContext('2d');
            ctx.clearRect(0, 0, 140, 140);

            const center = 70;
            const scale = 0.8;

            // موقعیت بازیکن در مرکز
            ctx.fillStyle = '#00ff00';
            ctx.beginPath();
            ctx.arc(center, center, 4, 0, Math.PI * 2);
            ctx.fill();

            // رسم ربات‌ها روی رادار
            bots.forEach(b => {
                const relX = (b.mesh.position.x - camera.position.x) * scale;
                const relZ = (b.mesh.position.z - camera.position.z) * scale;

                if (Math.abs(relX) < 65 && Math.abs(relZ) < 65) {
                    ctx.fillStyle = b.team === player.team ? '#3498db' : '#e74c3c';
                    ctx.beginPath();
                    ctx.arc(center + relX, center + relZ, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function showKillFeed(msg) {
            const feed = document.getElementById('kill-feed');
            const item = document.createElement('div');
            item.className = 'kill-message';
            item.innerText = msg;
            feed.appendChild(item);

            setTimeout(() => item.remove(), 4000);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- حلقه اصلی بازی (Animate Loop) ---
        function animate() {
            requestAnimationFrame(animate);

            if (isGameStarted) {
                camera.rotation.order = "YXZ";
                camera.rotation.y = mouseLook.yaw;
                camera.rotation.x = mouseLook.pitch;

                updatePlayerMovement();
                updateBotsAI();
                updateBullets();
                updateRadar();
            }

            renderer.render(scene, camera);
        }

        // راه‌اندازی اولیه
        window.onload = function() {
            initEngine();
        };
    </script>
</body>
</html>
