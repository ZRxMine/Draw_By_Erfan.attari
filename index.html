<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>استودیوی نقاشی با دست فیزیکی | Physics Hand Paint Studio</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Vazirmatn Font -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

    <!-- MediaPipe Hands & Camera Utils for AI WebCam Hand Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * {
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            overflow: hidden;
        }

        /* Glassmorphism styling */
        .glass-panel {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .glass-btn.active {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }

        /* Range Slider Styling */
        input[type=range] {
            accent-color: #a855f7;
        }

        canvas {
            cursor: none; /* Hide default cursor to render physics hand */
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between overflow-hidden relative">

    <!-- TOP NAVBAR -->

                <i class="fa-solid fa-hand-sparkles text-xl text-white"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-300 via-purple-300 to-pink-300">
                    نقاشی با دست فیزیکی

                <p class="text-xs text-gray-400">Physics Hand Paint Studio</p>
            </div>
        </div>

            <!-- WebCam Control Toggle -->
            <button id="btn-camera" class="glass-btn px-3 py-2 rounded-xl text-xs flex items-center gap-2 text-indigo-300 hover:text-indigo-200 border-indigo-500/30">
                <i class="fa-solid fa-camera text-indigo-400"></i>

            </button>
            <button id="btn-sound" class="glass-btn px-3 py-2 rounded-xl text-xs flex items-center gap-2 text-gray-200">
                <i class="fa-solid fa-volume-high text-purple-400"></i>
                <span class="hidden sm:inline">صدا</span>
            </button>
            <button id="btn-clear" class="glass-btn px-3 py-2 rounded-xl text-xs flex items-center gap-2 text-red-400 hover:text-red-300">
                <i class="fa-solid fa-trash-can"></i>

    <!-- MAIN STUDIO WORKSPACE -->
    <div class="flex-1 flex relative overflow-hidden">

        <!-- LEFT TOOLBAR -->
        <aside class="w-72 glass-panel p-4 flex flex-col gap-5 z-20 overflow-y-auto max-h-full shadow-2xl">
            <!-- Tool Selection -->
            <div>
                <label class="text-xs font-semibold text-gray-400 mb-2 block flex items-center justify-between">

                <div class="grid grid-cols-2 gap-2">

            <!-- Hand Visual Style -->
            <div>
                <label class="text-xs font-semibold text-gray-400 mb-2 block">ظاهر فیزیکی دست</label>
                <div class="grid grid-cols-3 gap-2">
                    <button data-style="cyber" class="hand-style-btn glass-btn py-2 rounded-xl text-xs font-medium active">سایبر</button>
                    <button data-style="neon" class="hand-style-btn glass-btn py-2 rounded-xl text-xs font-medium">نئون</button>
                    <button data-style="real" class="hand-style-btn glass-btn py-2 rounded-xl text-xs font-medium">آناتومیک</button>
                </div>

            <!-- Color Palette -->
            <div>

        <!-- CANVAS AREA -->

            <!-- Floating Info Badge -->
            <div class="absolute bottom-4 right-4 glass-panel px-4 py-2 rounded-2xl z-20 flex items-center gap-3 text-xs text-gray-300 shadow-xl pointer-events-none">
                <i class="fa-solid fa-hand-pointer text-indigo-400 animate-pulse"></i>
                <span id="control-hint-text">برای کشیدن، ماوس یا لمس را نگه دارید | فشار و کلیک = انعطاف مفاصل دست</span>
            </div>

            <!-- WebCam Live Preview Overlay PIP -->
            <div id="webcam-container" class="hidden absolute top-4 left-4 z-30 glass-panel p-2 rounded-2xl flex-col items-center shadow-2xl border border-indigo-500/30 w-48">
                <div class="relative w-full h-32 rounded-xl overflow-hidden bg-black/60 flex items-center justify-center">

                    <canvas id="webcam-canvas" class="absolute inset-0 w-full h-full transform -scale-x-100 pointer-events-none"></canvas>
                    <div id="camera-loading" class="absolute inset-0 bg-slate-900/90 flex flex-col items-center justify-center gap-2 text-xs text-indigo-300">
                        <i class="fa-solid fa-spinner fa-spin text-lg"></i>

                        <i class="fa-solid fa-circle text-[8px]"></i> در حال دریافت...

                </div>
            </div>
        </main>

    <script>
        // Web Audio Synthesizer for Interactive Sound FX
        class AudioFx {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.initAudio();
            }

            initAudio() {
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.ctx = new AudioCtx();
                    }
                } catch(e) {
                    console.warn("AudioContext not supported");
                }
            }

            ensureState() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playSpray() {
                if (!this.enabled || !this.ctx) return;
                this.ensureState();
                
                try {
                    const bufferSize = this.ctx.sampleRate * 0.04;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }

                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 1200 + Math.random() * 800;
                    filter.Q.value = 3;

                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    noise.start();
                } catch(e) {}
            }

            playSplat() {
                if (!this.enabled || !this.ctx) return;
                this.ensureState();

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.1);

                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.1);
                } catch(e) {}
            }

            playStroke() {
                if (!this.enabled || !this.ctx) return;
                this.ensureState();

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(120 + Math.random() * 40, this.ctx.currentTime);

                    gain.gain.setValueAtTime(0.02, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.06);
                } catch(e) {}
            }
        }

        const audio = new AudioFx();

        // Articulated 2D Inverse Kinematics / Spring Hand Model
        class PhysicsHand {
            constructor() {
                this.x = window.innerWidth / 2;
                this.y = window.innerHeight / 2;
                this.targetX = this.x;
                this.targetY = this.y;
                this.vx = 0;
                this.vy = 0;

                this.wristX = this.x;
                this.wristY = this.y + 120;

                this.isPressing = false;
                this.style = 'cyber'; // cyber, neon, real

                // 5 Fingers structure (Thumb, Index, Middle, Ring, Pinky)
                this.fingers = [
                    { name: 'Thumb', baseAngle: -0.6, lengths: [35, 25], flex: 0 },
                    { name: 'Index', baseAngle: -0.25, lengths: [45, 30, 20], flex: 0 },
                    { name: 'Middle', baseAngle: 0.0, lengths: [50, 35, 22], flex: 0 },
                    { name: 'Ring', baseAngle: 0.25, lengths: [45, 32, 20], flex: 0 },
                    { name: 'Pinky', baseAngle: 0.55, lengths: [35, 25, 18], flex: 0 }
                ];
            }

            update(targetX, targetY, isPressing, stiffness) {
                this.targetX = targetX;
                this.targetY = targetY;
                this.isPressing = isPressing;

                // Physics spring dampening for hand position
                const k = 0.15 * (stiffness / 100);
                const damp = 0.72;

                const ax = (this.targetX - this.x) * k;
                const ay = (this.targetY - this.y) * k;

                this.vx = (this.vx + ax) * damp;
                this.vy = (this.vy + ay) * damp;

                this.x += this.vx;
                this.y += this.vy;

                // Lagging wrist position for fluid arm movement
                const targetWristX = this.x - this.vx * 4;
                const targetWristY = this.y + 110 - this.vy * 2;

                this.wristX += (targetWristX - this.wristX) * 0.1;
                this.wristY += (targetWristY - this.wristY) * 0.1;

                // Update finger flex based on velocity & pressing
                const pressureTarget = isPressing ? 0.8 : 0.1;
                this.fingers.forEach((f, idx) => {
                    const wave = Math.sin(Date.now() * 0.005 + idx) * 0.05;
                    f.flex += (pressureTarget + wave - f.flex) * 0.2;
                });
            }

            draw(ctx, activeTool, currentColor, size) {
                ctx.save();

                // Draw Forearm
                ctx.beginPath();
                ctx.moveTo(this.wristX - 35, this.wristY + 180);
                ctx.lineTo(this.wristX - 25, this.wristY);
                ctx.lineTo(this.wristX + 25, this.wristY);
                ctx.lineTo(this.wristX + 35, this.wristY + 180);
                
                if (this.style === 'cyber') {
                    ctx.fillStyle = 'rgba(30, 41, 59, 0.85)';
                    ctx.strokeStyle = '#6366f1';
                    ctx.lineWidth = 2;
                    ctx.fill();
                    ctx.stroke();
                } else if (this.style === 'neon') {
                    ctx.strokeStyle = '#a855f7';
                    ctx.shadowColor = '#a855f7';
                    ctx.shadowBlur = 12;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                } else {
                    ctx.fillStyle = '#e2e8f0';
                    ctx.fill();
                }

                // Draw Palm
                ctx.beginPath();
                ctx.moveTo(this.wristX - 25, this.wristY);
                ctx.lineTo(this.x - 30, this.y + 20);
                ctx.lineTo(this.x, this.y + 15);
                ctx.lineTo(this.x + 30, this.y + 20);
                ctx.lineTo(this.wristX + 25, this.wristY);
                ctx.closePath();

                if (this.style === 'cyber') {
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                    ctx.strokeStyle = '#818cf8';
                    ctx.fill();
                    ctx.stroke();
                } else if (this.style === 'neon') {
                    ctx.strokeStyle = '#ec4899';
                    ctx.stroke();
                } else {
                    ctx.fillStyle = '#cbd5e1';
                    ctx.fill();
                }

                // Render 5 Articulated Fingers
                this.fingers.forEach((finger, i) => {
                    let jointX = this.x + (i - 2) * 12;
                    let jointY = this.y + 15 + Math.abs(i - 2) * 3;

                    ctx.beginPath();
                    ctx.moveTo(jointX, jointY);

                    let currentAngle = -Math.PI / 2 + finger.baseAngle;

                    finger.lengths.forEach((len, j) => {
                        const bend = finger.flex * (j + 1) * 0.35;
                        currentAngle += bend * (i > 2 ? 0.8 : 1);

                        jointX += Math.cos(currentAngle) * len;
                        jointY += Math.sin(currentAngle) * len;

                        ctx.lineTo(jointX, jointY);
                    });

                    if (this.style === 'cyber') {
                        ctx.strokeStyle = (i === 1) ? currentColor : '#94a3b8';
                        ctx.lineWidth = Math.max(2, 7 - jIdx(i));
                        ctx.lineCap = 'round';
                        ctx.stroke();

                        // Glowing joint nodes
                        ctx.beginPath();
                        ctx.arc(jointX, jointY, 4, 0, Math.PI * 2);
                        ctx.fillStyle = currentColor;
                        ctx.fill();
                    } else if (this.style === 'neon') {
                        ctx.strokeStyle = '#06b6d4';
                        ctx.shadowColor = '#06b6d4';
                        ctx.shadowBlur = 10;
                        ctx.lineWidth = 5;
                        ctx.lineCap = 'round';
                        ctx.stroke();
                    } else {
                        ctx.strokeStyle = '#94a3b8';
                        ctx.lineWidth = 7;
                        ctx.lineCap = 'round';
                        ctx.stroke();
                    }
                });

                // Draw Tool Attached to Index Tip / Hand
                this.drawTool(ctx, activeTool, currentColor, size);

                ctx.restore();
            }

            drawTool(ctx, tool, color, size) {
                const tipX = this.x - 5;
                const tipY = this.y - 35;

                ctx.save();
                ctx.translate(tipX, tipY);

                if (tool === 'brush') {
                    ctx.fillStyle = '#475569';
                    ctx.fillRect(-4, 0, 8, 25);
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.arc(0, 0, size / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else if (tool === 'spray') {
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(-10, -5, 20, 35);
                    ctx.fillStyle = color;
                    ctx.fillRect(-6, -12, 12, 7);
                } else if (tool === 'slime') {
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.arc(0, 5, size / 1.5, 0, Math.PI * 2);
                    ctx.fill();
                } else if (tool === 'smudge') {
                    ctx.fillStyle = '#f59e0b';
                    ctx.beginPath();
                    if (ctx.roundRect) {
                        ctx.roundRect(-15, -10, 30, 25, 8);
                    } else {
                        ctx.rect(-15, -10, 30, 25);
                    }
                    ctx.fill();
                } else if (tool === 'bucket') {
                    ctx.fillStyle = '#334155';
                    ctx.beginPath();
                    ctx.arc(0, 5, 18, 0, Math.PI);
                    ctx.fill();
                    ctx.fillStyle = color;
                    ctx.fillRect(-14, 0, 28, 5);
                }

                ctx.restore();
            }
        }

        function jIdx(i) { return Math.abs(i - 2); }

        class StudioApp {
            constructor() {
                this.paintCanvas = document.getElementById('paintCanvas');
                this.paintCtx = this.paintCanvas.getContext('2d', { willReadFrequently: true });

                this.physicsCanvas = document.getElementById('physicsCanvas');
                this.physicsCtx = this.physicsCanvas.getContext('2d');

                this.hand = new PhysicsHand();
                this.particles = [];
                this.stencils = [];
                this.history = [];

                // Camera & AI State
                this.isCameraActive = false;
                this.cameraUtils = null;
                this.handsDetector = null;
                this.camVideo = document.getElementById('webcam-video');
                this.camCanvas = document.getElementById('webcam-canvas');
                this.camCtx = this.camCanvas ? this.camCanvas.getContext('2d') : null;

                // State
                this.activeTool = 'brush';
                this.currentColor = '#a855f7';
                this.brushSize = 25;
                this.stiffness = 80;
                this.gravityEnabled = true;
                this.bgStyle = 'dark';
                this.isPointerDown = false;

                this.pointerX = window.innerWidth / 2;
                this.pointerY = window.innerHeight / 2;

                // Initialize canvas dimensions & background properly
                this.initCanvasSize();
                this.initPalette();
                this.renderBackground();
                this.bindEvents();
                this.saveState();

                // Start Main Animation Loop
                this.animate = this.animate.bind(this);
                requestAnimationFrame(this.animate);
            }

            initCanvasSize() {
                const w = Math.max(window.innerWidth || 800, 100);
                const h = Math.max(window.innerHeight || 600, 100);

                let tempCanvas = null;
                if (this.paintCanvas.width > 0 && this.paintCanvas.height > 0) {
                    tempCanvas = document.createElement('canvas');
                    tempCanvas.width = this.paintCanvas.width;
                    tempCanvas.height = this.paintCanvas.height;
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCtx.drawImage(this.paintCanvas, 0, 0);
                }

                this.paintCanvas.width = w;
                this.paintCanvas.height = h;
                this.physicsCanvas.width = w;
                this.physicsCanvas.height = h;

                if (this.camCanvas) {
                    this.camCanvas.width = 192;
                    this.camCanvas.height = 128;
                }

                if (tempCanvas) {
                    this.paintCtx.drawImage(tempCanvas, 0, 0);
                } else {
                    this.renderBackground();
                }
            }

            initPalette() {
                const presetContainer = document.getElementById('color-presets');
                if (!presetContainer) return;
                presetContainer.innerHTML = '';

                const colors = [
                    '#a855f7', '#6366f1', '#ec4899', '#3b82f6',
                    '#06b6d4', '#10b981', '#f59e0b', '#ef4444',
                    '#ffffff', '#64748b', '#000000', '#f43f5e'
                ];

                colors.forEach((col) => {
                    const btn = document.createElement('button');
                    btn.className = `w-7 h-7 rounded-lg border border-white/20 transition-transform hover:scale-110 cursor-pointer ${col === this.currentColor ? 'ring-2 ring-white scale-110' : ''}`;
                    btn.style.backgroundColor = col;
                    btn.addEventListener('click', () => {
                        this.currentColor = col;
                        const customInput = document.getElementById('custom-color');
                        if (customInput && col.length === 7) customInput.value = col;
                        document.querySelectorAll('#color-presets button').forEach(b => b.classList.remove('ring-2', 'ring-white', 'scale-110'));
                        btn.classList.add('ring-2', 'ring-white', 'scale-110');
                    });
                    presetContainer.appendChild(btn);
                });
            }

            renderBackground() {
                const w = this.paintCanvas.width;
                const h = this.paintCanvas.height;
                if (!w || !h) return;

                this.paintCtx.save();
                if (this.bgStyle === 'dark') {
                    this.paintCtx.fillStyle = '#0b0f19';
                    this.paintCtx.fillRect(0, 0, w, h);
                } else if (this.bgStyle === 'grid') {
                    this.paintCtx.fillStyle = '#090d16';
                    this.paintCtx.fillRect(0, 0, w, h);
                    this.paintCtx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                    this.paintCtx.lineWidth = 1;
                    const gridSize = 40;
                    for (let x = 0; x < w; x += gridSize) {
                        this.paintCtx.beginPath();
                        this.paintCtx.moveTo(x, 0);
                        this.paintCtx.lineTo(x, h);
                        this.paintCtx.stroke();
                    }
                    for (let y = 0; y < h; y += gridSize) {
                        this.paintCtx.beginPath();
                        this.paintCtx.moveTo(0, y);
                        this.paintCtx.lineTo(w, y);
                        this.paintCtx.stroke();
                    }
                } else if (this.bgStyle === 'paper') {
                    this.paintCtx.fillStyle = '#1e1c18';
                    this.paintCtx.fillRect(0, 0, w, h);
                    this.paintCtx.fillStyle = 'rgba(255, 255, 255, 0.015)';
                    for (let i = 0; i < 4000; i++) {
                        const px = Math.random() * w;
                        const py = Math.random() * h;
                        this.paintCtx.fillRect(px, py, 2, 2);
                    }
                }
                this.paintCtx.restore();
            }

            initCameraTracking() {
                if (this.handsDetector) return;

                const loadingEl = document.getElementById('camera-loading');
                const statusEl = document.getElementById('cam-status');

                if (typeof window.Hands === 'undefined' || typeof window.Camera === 'undefined') {
                    if (loadingEl) loadingEl.innerHTML = `<span class="text-amber-400 text-center px-2 text-[10px]">کتابخانه دوربین در حال بارگذاری است...</span>`;
                    return;
                }

                try {
                    this.handsDetector = new window.Hands({
                        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                    });

                    this.handsDetector.setOptions({
                        maxNumHands: 1,
                        modelComplexity: 1,
                        minDetectionConfidence: 0.6,
                        minTrackingConfidence: 0.6
                    });

                    this.handsDetector.onResults((results) => this.onHandTrackingResults(results));

                    this.cameraUtils = new window.Camera(this.camVideo, {
                        onFrame: async () => {
                            if (this.isCameraActive && this.handsDetector && this.camVideo) {
                                try {
                                    await this.handsDetector.send({ image: this.camVideo });
                                } catch(err) {}
                            }
                        },
                        width: 320,
                        height: 240
                    });

                    this.cameraUtils.start().then(() => {
                        if (loadingEl) loadingEl.classList.add('hidden');
                        if (statusEl) {
                            statusEl.innerHTML = `<i class="fa-solid fa-circle text-[8px]"></i> فعال`;
                            statusEl.className = "flex items-center gap-1 text-emerald-400";
                        }
                    }).catch(err => {
                        console.error("Camera access error:", err);
                        if (loadingEl) loadingEl.innerHTML = `<span class="text-red-400 text-center px-2">خطا در دسترسی به دوربین</span>`;
                        if (statusEl) {
                            statusEl.innerHTML = `<i class="fa-solid fa-circle text-[8px]"></i> غیرفعال`;
                            statusEl.className = "flex items-center gap-1 text-red-400";
                        }
                    });

                } catch (e) {
                    console.error("MediaPipe initialization error:", e);
                }
            }

            onHandTrackingResults(results) {
                if (!this.camCtx || !this.camCanvas) return;
                this.camCtx.clearRect(0, 0, this.camCanvas.width, this.camCanvas.height);

                const statusEl = document.getElementById('cam-status');

                if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                    if (statusEl) {
                        statusEl.innerHTML = `<i class="fa-solid fa-circle text-[8px]"></i> در انتظار دست...`;
                        statusEl.className = "flex items-center gap-1 text-amber-400";
                    }
                    return;
                }

                if (statusEl) {
                    statusEl.innerHTML = `<i class="fa-solid fa-circle text-[8px]"></i> دست شناسایی شد`;
                    statusEl.className = "flex items-center gap-1 text-emerald-400";
                }

                const landmarks = results.multiHandLandmarks[0];

                this.drawLandmarksPreview(landmarks);

                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];

                const rawX = (1 - indexTip.x) * window.innerWidth;
                const rawY = indexTip.y * window.innerHeight;

                this.pointerX += (rawX - this.pointerX) * 0.45;
                this.pointerY += (rawY - this.pointerY) * 0.45;

                const dx = thumbTip.x - indexTip.x;
                const dy = thumbTip.y - indexTip.y;
                const dz = (thumbTip.z || 0) - (indexTip.z || 0);
                const pinchDistance = Math.sqrt(dx * dx + dy * dy + dz * dz);

                const isPinching = pinchDistance < 0.075;

                if (isPinching && !this.isPointerDown) {
                    if (this.activeTool === 'bucket') {
                        this.triggerBucketSplash(this.pointerX, this.pointerY);
                    } else if (this.activeTool === 'stencil') {
                        this.spawnStencil(this.pointerX, this.pointerY);
                    }
                }

                this.isPointerDown = isPinching;
                this.syncPhysicsHandFlex(landmarks);
            }

            drawLandmarksPreview(landmarks) {
                if (!this.camCtx || !this.camCanvas) return;
                const w = this.camCanvas.width;
                const h = this.camCanvas.height;

                this.camCtx.fillStyle = '#a855f7';
                this.camCtx.strokeStyle = '#6366f1';
                this.camCtx.lineWidth = 2;

                landmarks.forEach((pt) => {
                    this.camCtx.beginPath();
                    this.camCtx.arc(pt.x * w, pt.y * h, 3, 0, Math.PI * 2);
                    this.camCtx.fill();
                });
            }

            syncPhysicsHandFlex(landmarks) {
                const wrist = landmarks[0];
                const tips = [4, 8, 12, 16, 20];

                tips.forEach((tipIdx, fingerIdx) => {
                    const tip = landmarks[tipIdx];
                    const dist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
                    const flex = Math.max(0, Math.min(1, 1 - (dist * 2.2)));
                    if (this.hand.fingers[fingerIdx]) {
                        this.hand.fingers[fingerIdx].flex = flex;
                    }
                });
            }

            toggleCamera() {
                const webcamBox = document.getElementById('webcam-container');
                const btnCam = document.getElementById('btn-camera');
                const hintText = document.getElementById('control-hint-text');

                this.isCameraActive = !this.isCameraActive;

                if (this.isCameraActive) {
                    if (webcamBox) {
                        webcamBox.classList.remove('hidden');
                        webcamBox.classList.add('flex');
                    }
                    if (btnCam) btnCam.classList.add('active');
                    this.initCameraTracking();
                    if (hintText) hintText.textContent = "دوربین فعال است | چسباندن شست و اشاره = نقاشی کشیدن";
                } else {
                    if (webcamBox) {
                        webcamBox.classList.add('hidden');
                        webcamBox.classList.remove('flex');
                    }
                    if (btnCam) btnCam.classList.remove('active');
                    this.isPointerDown = false;
                    if (hintText) hintText.textContent = "برای کشیدن، ماوس یا لمس را نگه دارید | فشار و کلیک = انعطاف مفاصل دست";
                }
            }

            bindEvents() {
                window.addEventListener('resize', () => this.initCanvasSize());

                // Pointer events
                window.addEventListener('pointermove', (e) => {
                    this.pointerX = e.clientX;
                    this.pointerY = e.clientY;
                });

                window.addEventListener('pointerdown', (e) => {
                    if (e.target.closest('aside') || e.target.closest('header')) return;
                    this.pointerX = e.clientX;
                    this.pointerY = e.clientY;
                    this.isPointerDown = true;

                    if (this.activeTool === 'bucket') {
                        this.triggerBucketSplash(e.clientX, e.clientY);
                    } else if (this.activeTool === 'stencil') {
                        this.spawnStencil(e.clientX, e.clientY);
                    }
                });

                window.addEventListener('pointerup', () => {
                    if (this.isPointerDown) {
                        this.saveState();
                    }
                    this.isPointerDown = false;
                });

                // UI Event Handlers
                document.querySelectorAll('.tool-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                        const target = e.currentTarget;
                        target.classList.add('active');
                        this.activeTool = target.dataset.tool;
                    });
                });

                document.querySelectorAll('.hand-style-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.hand-style-btn').forEach(b => b.classList.remove('active'));
                        const target = e.currentTarget;
                        target.classList.add('active');
                        this.hand.style = target.dataset.style;
                    });
                });

                document.querySelectorAll('.bg-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
                        const target = e.currentTarget;
                        target.classList.add('active');
                        this.bgStyle = target.dataset.bg;
                        this.renderBackground();
                    });
                });

                const customColorEl = document.getElementById('custom-color');
                if (customColorEl) {
                    customColorEl.addEventListener('input', (e) => {
                        this.currentColor = e.target.value;
                    });
                }

                const sizeSlider = document.getElementById('size-slider');
                if (sizeSlider) {
                    sizeSlider.addEventListener('input', (e) => {
                        this.brushSize = parseInt(e.target.value);
                        document.getElementById('size-val').textContent = this.brushSize;
                    });
                }

                const stiffnessSlider = document.getElementById('stiffness-slider');
                if (stiffnessSlider) {
                    stiffnessSlider.addEventListener('input', (e) => {
                        this.stiffness = parseInt(e.target.value);
                        document.getElementById('stiffness-val').textContent = this.stiffness + '%';
                    });
                }

                const gravityToggle = document.getElementById('gravity-toggle');
                if (gravityToggle) {
                    gravityToggle.addEventListener('change', (e) => {
                        this.gravityEnabled = e.target.checked;
                    });
                }

                const btnClear = document.getElementById('btn-clear');
                if (btnClear) {
                    btnClear.addEventListener('click', () => {
                        this.renderBackground();
                        this.particles = [];
                        this.stencils = [];
                        this.saveState();
                    });
                }

                const btnUndo = document.getElementById('btn-undo');
                if (btnUndo) {
                    btnUndo.addEventListener('click', () => this.undo());
                }

                const btnSave = document.getElementById('btn-save');
                if (btnSave) {
                    btnSave.addEventListener('click', () => this.saveImage());
                }

                const btnSound = document.getElementById('btn-sound');
                if (btnSound) {
                    btnSound.addEventListener('click', (e) => {
                        audio.enabled = !audio.enabled;
                        e.currentTarget.classList.toggle('opacity-50', !audio.enabled);
                    });
                }

                const btnCamera = document.getElementById('btn-camera');
                if (btnCamera) {
                    btnCamera.addEventListener('click', () => {
                        this.toggleCamera();
                    });
                }
            }

            saveState() {
                if (!this.paintCanvas.width || !this.paintCanvas.height) return;
                if (this.history.length > 15) this.history.shift();
                try {
                    this.history.push(this.paintCtx.getImageData(0, 0, this.paintCanvas.width, this.paintCanvas.height));
                } catch (e) {
                    console.warn("Failed to save history state:", e);
                }
            }

            undo() {
                if (this.history.length > 1) {
                    this.history.pop(); // Current
                    const prev = this.history[this.history.length - 1];
                    this.paintCtx.putImageData(prev, 0, 0);
                }
            }

            saveImage() {
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = this.paintCanvas.width;
                exportCanvas.height = this.paintCanvas.height;
                const eCtx = exportCanvas.getContext('2d');
                eCtx.drawImage(this.paintCanvas, 0, 0);

                const link = document.createElement('a');
                link.download = `physics-hand-painting-${Date.now()}.png`;
                link.href = exportCanvas.toDataURL();
                link.click();
            }

            spawnParticles() {
                if (!this.isPointerDown) return;

                const tipX = this.hand.x - 5;
                const tipY = this.hand.y - 35;

                if (this.activeTool === 'brush') {
                    this.paintCtx.save();
                    this.paintCtx.beginPath();
                    this.paintCtx.arc(tipX, tipY, this.brushSize / 2, 0, Math.PI * 2);
                    this.paintCtx.fillStyle = this.currentColor;
                    this.paintCtx.shadowColor = this.currentColor;
                    this.paintCtx.shadowBlur = 4;
                    this.paintCtx.fill();
                    this.paintCtx.restore();

                    audio.playStroke();
                } 
                else if (this.activeTool === 'spray') {
                    const count = Math.floor(this.brushSize / 2);
                    for (let i = 0; i < count; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const dist = Math.random() * this.brushSize;
                        const px = tipX + Math.cos(angle) * dist;
                        const py = tipY + Math.sin(angle) * dist;

                        this.paintCtx.fillStyle = this.currentColor;
                        this.paintCtx.beginPath();
                        this.paintCtx.arc(px, py, 1 + Math.random() * 2, 0, Math.PI * 2);
                        this.paintCtx.fill();
                    }
                    audio.playSpray();
                } 
                else if (this.activeTool === 'slime') {
                    for (let i = 0; i < 3; i++) {
                        this.particles.push({
                            x: tipX + (Math.random() - 0.5) * 20,
                            y: tipY + (Math.random() - 0.5) * 20,
                            vx: (Math.random() - 0.5) * 6,
                            vy: Math.random() * 4 + 2,
                            radius: 4 + Math.random() * (this.brushSize / 3),
                            color: this.currentColor,
                            life: 1.0
                        });
                    }
                    audio.playSplat();
                }
                else if (this.activeTool === 'smudge') {
                    const size = Math.round(this.brushSize * 1.5);
                    const half = Math.floor(size / 2);
                    let sx = Math.floor(tipX - half);
                    let sy = Math.floor(tipY - half);

                    const canvasW = this.paintCanvas.width;
                    const canvasH = this.paintCanvas.height;

                    if (sx < 0) sx = 0;
                    if (sy < 0) sy = 0;
                    const sw = Math.min(size, canvasW - sx);
                    const sh = Math.min(size, canvasH - sy);

                    if (sw > 0 && sh > 0) {
                        try {
                            const imgData = this.paintCtx.getImageData(sx, sy, sw, sh);
                            const dx = sx + Math.round((Math.random() - 0.5) * 4);
                            const dy = sy + Math.round((Math.random() - 0.5) * 4);
                            this.paintCtx.putImageData(imgData, dx, dy);
                        } catch (e) {}
                    }
                }
            }

            triggerBucketSplash(x, y) {
                const splashCount = 40;
                for (let i = 0; i < splashCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 4 + Math.random() * 12;
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        radius: 6 + Math.random() * 10,
                        color: this.currentColor,
                        life: 1.0
                    });
                }
                audio.playSplat();
            }

            spawnStencil(x, y) {
                const shapes = ['star', 'circle', 'heart'];
                const shape = shapes[Math.floor(Math.random() * shapes.length)];
                this.stencils.push({ x, y, shape, size: this.brushSize * 2, color: this.currentColor });
                this.drawStencil(x, y, shape, this.brushSize * 2, this.currentColor);
            }

            drawStencil(x, y, shape, size, color) {
                this.paintCtx.save();
                this.paintCtx.translate(x, y);
                this.paintCtx.fillStyle = color;
                this.paintCtx.beginPath();

                if (shape === 'star') {
                    for (let i = 0; i < 5; i++) {
                        this.paintCtx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * size, -Math.sin((18 + i * 72) * Math.PI / 180) * size);
                        this.paintCtx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (size / 2), -Math.sin((54 + i * 72) * Math.PI / 180) * (size / 2));
                    }
                } else if (shape === 'heart') {
                    this.paintCtx.arc(-size / 4, -size / 4, size / 4, Math.PI, 0, false);
                    this.paintCtx.arc(size / 4, -size / 4, size / 4, Math.PI, 0, false);
                    this.paintCtx.lineTo(0, size / 2);
                } else {
                    this.paintCtx.arc(0, 0, size / 2, 0, Math.PI * 2);
                }

                this.paintCtx.closePath();
                this.paintCtx.fill();
                this.paintCtx.restore();
            }

            updateParticles() {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];

                    if (this.gravityEnabled) {
                        p.vy += 0.25;
                    }

                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.95;
                    p.vy *= 0.95;

                    this.paintCtx.fillStyle = p.color;
                    this.paintCtx.beginPath();
                    this.paintCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    this.paintCtx.fill();

                    p.radius -= 0.15;
                    if (p.radius <= 0.5 || p.y > this.paintCanvas.height) {
                        this.particles.splice(i, 1);
                    }
                }
            }

            animate() {
                this.physicsCtx.clearRect(0, 0, this.physicsCanvas.width, this.physicsCanvas.height);

                this.hand.update(this.pointerX, this.pointerY, this.isPointerDown, this.stiffness);

                this.spawnParticles();

                this.updateParticles();

                this.hand.draw(this.physicsCtx, this.activeTool, this.currentColor, this.brushSize);

                requestAnimationFrame(this.animate);
            }
        }

        // Initialize Studio on Window Load safely
        window.addEventListener('load', () => {
            try {
                window.studioAppInstance = new StudioApp();
            } catch(err) {
                console.error("Initialization error:", err);
            }
        });
    </script>
</body>
