<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار صوتی پیشرفته جارویس - JARVIS AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Vazirmatn Font -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Vazirmatn', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        body {
            background-color: #030712;
            overflow-x: hidden;
        }

        /* Arc Reactor & Orb Animations */
        @keyframes arc-pulse {
            0% {
                transform: scale(0.98);
                box-shadow: 0 0 25px rgba(6, 182, 212, 0.6), inset 0 0 20px rgba(6, 182, 212, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 60px rgba(14, 165, 233, 0.9), inset 0 0 35px rgba(56, 189, 248, 0.7);
            }
            100% {
                transform: scale(0.98);
                box-shadow: 0 0 25px rgba(6, 182, 212, 0.6), inset 0 0 20px rgba(6, 182, 212, 0.4);
            }
        }

        @keyframes rotate-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes reverse-rotate-ring {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes speak-pulse {
            0% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.6); }
            50% { box-shadow: 0 0 70px rgba(245, 158, 11, 1); }
            100% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.6); }
        }

        @keyframes listen-pulse {
            0% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.7); }
            50% { box-shadow: 0 0 80px rgba(239, 68, 68, 1); }
            100% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.7); }
        }

        .arc-reactor-idle {
            animation: arc-pulse 3s infinite ease-in-out;
            background: radial-gradient(circle at center, #0284c7 0%, #0369a1 40%, #0f172a 85%);
        }

        .arc-reactor-listening {
            animation: listen-pulse 1.2s infinite ease-in-out;
            background: radial-gradient(circle at center, #dc2626 0%, #991b1b 40%, #180808 85%);
        }

        .arc-reactor-speaking {
            animation: speak-pulse 1.5s infinite ease-in-out;
            background: radial-gradient(circle at center, #d97706 0%, #b45309 40%, #1c1002 85%);
        }

        .ring-rotate-fast {
            animation: rotate-ring 8s linear infinite;
        }

        .ring-rotate-reverse {
            animation: reverse-rotate-ring 12s linear infinite;
        }

        .glow-text-cyan {
            text-shadow: 0 0 20px rgba(6, 182, 212, 0.8), 0 0 40px rgba(14, 165, 233, 0.4);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .hud-border {
            border: 1px solid rgba(6, 182, 212, 0.3);
            position: relative;
        }
        
        .hud-border::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; width: 8px; height: 8px;
            border-top: 2px solid #38bdf8;
            border-left: 2px solid #38bdf8;
        }

        .hud-border::after {
            content: '';
            position: absolute;
            bottom: -2px; right: -2px; width: 8px; height: 8px;
            border-bottom: 2px solid #38bdf8;
            border-right: 2px solid #38bdf8;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center relative text-slate-100 select-none overflow-hidden">

    <canvas id="bgCanvas" class="absolute inset-0 z-0 pointer-events-none"></canvas>

    <!-- Top Futuristic Header -->
    <header class="z-10 pt-6 text-center max-w-lg px-4 flex flex-col items-center">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-cyan-950/70 border border-cyan-500/40 text-xs font-semibold text-cyan-300 mb-2 shadow-lg backdrop-blur-md font-orbitron tracking-widest">
            <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
            J.A.R.V.I.S OS v4.2 ONLINE
        </div>
        <h1 class="text-3xl sm:text-4xl font-black tracking-wider glow-text-cyan text-cyan-400 font-orbitron">
            JARVIS
        </h1>
        <p class="text-slate-400 text-xs sm:text-sm mt-1">
            دستیار صوتی هوشمند اختصاصی
        </p>
    </header>

    <main class="z-10 flex flex-col items-center justify-center relative my-auto">
        
        <!-- Rotating Holographic Rings -->
        <div class="relative w-72 h-72 sm:w-96 sm:h-96 flex items-center justify-center">
            
            <!-- Outer HUD Tech Ring 1 -->
            <div class="absolute inset-0 rounded-full border-2 border-dashed border-cyan-500/30 ring-rotate-fast pointer-events-none"></div>
            <!-- Outer HUD Tech Ring 2 -->
            <div class="absolute inset-3 rounded-full border border-cyan-400/20 ring-rotate-reverse pointer-events-none"></div>
            <!-- Sound Visualizer Wave Container -->
            <div class="absolute inset-6 rounded-full border border-cyan-500/40 flex items-center justify-center pointer-events-none opacity-60">
                <canvas id="audioVisualizer" class="w-full h-full rounded-full"></canvas>
            </div>

            <!-- Central Arc Reactor / Orb Button -->
            <button id="jarvisOrb" aria-label="فعال سازی جارویس" class="arc-reactor-idle relative w-48 h-48 sm:w-60 sm:h-60 rounded-full flex flex-col items-center justify-center transition-all duration-500 shadow-2xl border-4 border-cyan-300/40 active:scale-95 hover:border-cyan-200 cursor-pointer group">
                
                <!-- Inner Core Glow -->
                <div class="absolute inset-4 rounded-full border border-cyan-200/40 flex items-center justify-center">
                    <i id="orbIcon" class="fa-solid fa-microchip text-4xl sm:text-5xl text-cyan-100 transition-all duration-300 group-hover:scale-110 drop-shadow-[0_0_15px_rgba(255,255,255,0.8)]"></i>
                </div>

                <span id="orbStatusText" class="absolute bottom-6 text-[11px] sm:text-xs font-bold text-cyan-100 tracking-wider font-orbitron uppercase bg-black/40 px-3 py-1 rounded-full border border-cyan-500/30">
                    CLICK TO ACTIVATE
                </span>
            </button>
        </div>

        <!-- Status Box -->
        <div id="statusHUD" class="mt-4 px-6 py-2.5 rounded-xl glass-panel hud-border text-xs sm:text-sm font-medium text-cyan-200 flex items-center gap-3 shadow-2xl transition-all duration-300">
            <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
            <span id="statusMessage">آماده دریافت دستورات صوتی سیستم</span>
        </div>

    </main>

    <!-- Bottom Transcript & Simulation Command Buttons -->
    <footer class="z-10 pb-6 w-full max-w-xl px-4 flex flex-col items-center gap-3">
        
        <!-- Live Transcript Display -->
        <div class="w-full glass-panel hud-border rounded-xl p-3.5 shadow-2xl text-right transition-all duration-300">
            <div class="flex justify-between items-center mb-1.5 pb-1.5 border-b border-cyan-900/60 text-xs">
                <span class="text-cyan-400 font-bold flex items-center gap-2 font-orbitron">
                    <i class="fa-solid fa-terminal text-cyan-400"></i> COMMAND CONSOLE
                </span>
                <span id="voiceEngineStatus" class="text-[10px] text-slate-400">موتور صوتی فعال (صدای مردانه)</span>
            </div>

            <div class="space-y-1.5 text-xs sm:text-sm min-h-[46px] flex flex-col justify-center">
                <p id="userTranscript" class="text-slate-300 italic">
                    <span class="text-cyan-400 font-bold">شما:</span> <span id="userText">منتظر شنیدن صدای شما...</span>
                </p>
                <p id="jarvisResponse" class="text-slate-100 font-semibold">
                    <span class="text-amber-400 font-bold">جارویس:</span> <span id="jarvisText">«در خدمت شما هستم قربان.»</span>
                </p>
            </div>
        </div>

        <!-- Command Quick Test Buttons -->
        <div class="flex flex-wrap justify-center items-center gap-2 w-full">
            <button id="cmdGoogleBtn" class="text-xs bg-cyan-950/80 hover:bg-cyan-900 border border-cyan-500/50 text-cyan-200 px-3 py-2 rounded-lg transition duration-200 flex items-center gap-1.5 active:scale-95 shadow-lg">
                <i class="fa-brands fa-google text-cyan-400"></i> «جارویس گوگل باز کن»
            </button>
            <button id="cmdMusicBtn" class="text-xs bg-amber-950/80 hover:bg-amber-900 border border-amber-500/50 text-amber-200 px-3 py-2 rounded-lg transition duration-200 flex items-center gap-1.5 active:scale-95 shadow-lg">
                <i class="fa-solid fa-compact-disc text-amber-400 animate-spin" style="animation-duration:4s;"></i> «جارویس اهنگ Back in Black پخش کن»
            </button>
            <button id="cmdStopMusicBtn" class="text-xs bg-rose-950/80 hover:bg-rose-900 border border-rose-500/50 text-rose-200 px-3 py-2 rounded-lg transition duration-200 flex items-center gap-1.5 active:scale-95 shadow-lg">
                <i class="fa-solid fa-stop text-rose-400"></i> «جارویس اهنگ قطع کن»
            </button>
        </div>
    </footer>

    <script>
        const jarvisOrb = document.getElementById('jarvisOrb');
        const orbIcon = document.getElementById('orbIcon');
        const orbStatusText = document.getElementById('orbStatusText');
        const statusHUD = document.getElementById('statusHUD');
        const statusDot = document.getElementById('statusDot');
        const statusMessage = document.getElementById('statusMessage');
        const userText = document.getElementById('userText');
        const jarvisText = document.getElementById('jarvisText');

        const cmdGoogleBtn = document.getElementById('cmdGoogleBtn');
        const cmdMusicBtn = document.getElementById('cmdMusicBtn');
        const cmdStopMusicBtn = document.getElementById('cmdStopMusicBtn');

        let currentState = 'idle';
        let recognition = null;
        let isMusicPlaying = false;
        let rockAudioCtx = null;
        let musicTimer = null;

        function setState(newState) {
            currentState = newState;
            jarvisOrb.className = jarvisOrb.className.replace(/arc-reactor-(idle|listening|speaking)/g, '');

            if (newState === 'idle') {
                jarvisOrb.classList.add('arc-reactor-idle');
                orbIcon.className = 'fa-solid fa-microchip text-4xl sm:text-5xl text-cyan-100 transition-all duration-300 group-hover:scale-110';
                orbStatusText.textContent = 'READY';
                statusDot.className = 'w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse';
                statusMessage.textContent = 'آماده دریافت دستور صوتی شما';
            } else if (newState === 'listening') {
                jarvisOrb.classList.add('arc-reactor-listening');
                orbIcon.className = 'fa-solid fa-microphone text-4xl sm:text-5xl text-red-200 animate-pulse';
                orbStatusText.textContent = 'LISTENING...';
                statusDot.className = 'w-2.5 h-2.5 rounded-full bg-red-500 animate-ping';
                statusMessage.textContent = 'جارویس در حال گوش دادن به صدای شما است...';
            } else if (newState === 'processing') {
                jarvisOrb.classList.add('arc-reactor-idle');
                orbIcon.className = 'fa-solid fa-rotate text-4xl sm:text-5xl text-cyan-200 animate-spin';
                orbStatusText.textContent = 'PROCESSING';
                statusDot.className = 'w-2.5 h-2.5 rounded-full bg-yellow-400 animate-pulse';
                statusMessage.textContent = 'در حال تحلیل فرمایش شما...';
            } else if (newState === 'speaking') {
                jarvisOrb.classList.add('arc-reactor-speaking');
                orbIcon.className = 'fa-solid fa-volume-high text-4xl sm:text-5xl text-amber-200 animate-bounce';
                orbStatusText.textContent = 'JARVIS SPEAKING';
                statusDot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse';
                statusMessage.textContent = 'جارویس در حال صحبت کردن است';
            }
        }

        function speakJarvis(text, onComplete) {
            setState('speaking');

            // Cancel any ongoing speech
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fa-IR';
            
            // Deep male pitch & deliberate authoritative rate
            utterance.pitch = 0.65; // Deep pitch for Jarvis male voice
            utterance.rate = 0.88;  // Calm, confident speed

            // Attempt to pick a male voice if available in system
            const voices = window.speechSynthesis.getVoices();
            const maleVoice = voices.find(v => 
                v.lang.includes('fa') || 
                v.name.toLowerCase().includes('male') || 
                v.name.toLowerCase().includes('david') || 
                v.name.toLowerCase().includes('george')
            );
            if (maleVoice) {
                utterance.voice = maleVoice;
            }

            utterance.onend = () => {
                setState('idle');
                if (typeof onComplete === 'function') onComplete();
            };

            utterance.onerror = () => {
                setState('idle');
                if (typeof onComplete === 'function') onComplete();
            };

            window.speechSynthesis.speak(utterance);
        }

        // Pre-load voices for Speech Synthesis
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        function stopBackInBlackMusic() {
            if (musicTimer) {
                clearInterval(musicTimer);
                musicTimer = null;
            }
            if (rockAudioCtx) {
                rockAudioCtx.close().catch(() => {});
                rockAudioCtx = null;
            }
            isMusicPlaying = false;
        }

        function playBackInBlackMusic() {
            stopBackInBlackMusic();

            try {
                rockAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (rockAudioCtx.state === 'suspended') {
                    rockAudioCtx.resume();
                }
            } catch (e) {
                console.error("Audio Context initialization failed:", e);
                return;
            }

            isMusicPlaying = true;

            const tempo = 94; // Iconic Back in Black tempo
            const stepDuration = (60 / tempo) / 4; 
            let step = 0;

            // Frequencies for E5, D5, A5 chords
            const freqE = [164.81, 246.94, 329.63]; // E chord
            const freqD = [146.83, 220.00, 293.66]; // D chord
            const freqA = [110.00, 220.00, 277.18]; // A chord

            // Pentatonic Fill Notes (E, D, C#, B, G)
            const fillNotes = [329.63, 293.66, 277.18, 246.94, 196.00, 164.81];

            // Distortion Curve generator for Electric Guitar effect
            function makeDistortionCurve(amount) {
                const k = typeof amount === 'number' ? amount : 50;
                const n_samples = 44100;
                const curve = new Float32Array(n_samples);
                const deg = Math.PI / 180;
                for (let i = 0; i < n_samples; ++i) {
                    const x = (i * 2) / n_samples - 1;
                    curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
                }
                return curve;
            }

            const distNode = rockAudioCtx.createWaveShaper();
            distNode.curve = makeDistortionCurve(100);
            distNode.oversample = '4x';

            const masterGain = rockAudioCtx.createGain();
            masterGain.gain.value = 0.3;

            distNode.connect(masterGain);
            masterGain.connect(rockAudioCtx.destination);

            function playGuitarChord(freqArray, time, duration) {
                freqArray.forEach(freq => {
                    const osc = rockAudioCtx.createOscillator();
                    const gain = rockAudioCtx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, time);

                    gain.gain.setValueAtTime(0.4, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + duration);

                    osc.connect(gain);
                    gain.connect(distNode);

                    osc.start(time);
                    osc.stop(time + duration);
                });
            }

            musicTimer = setInterval(() => {
                if (!rockAudioCtx || rockAudioCtx.state === 'closed') return;
                const now = rockAudioCtx.currentTime;
                const currentStep = step % 32;

                // 1. Classic Rock Drums (Kick & Snare & Hat)
                if ([0, 4, 8, 12, 16, 20, 24, 28].includes(currentStep)) {
                    // Kick Drum
                    const kick = rockAudioCtx.createOscillator();
                    const kickGain = rockAudioCtx.createGain();
                    kick.frequency.setValueAtTime(150, now);
                    kick.frequency.exponentialRampToValueAtTime(35, now + 0.15);
                    kickGain.gain.setValueAtTime(1, now);
                    kickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    kick.connect(kickGain);
                    kickGain.connect(rockAudioCtx.destination);
                    kick.start(now);
                    kick.stop(now + 0.15);
                }

                if ([4, 12, 20, 28].includes(currentStep)) {
                    // Snare Drum
                    const noise = rockAudioCtx.createBufferSource();
                    const buf = rockAudioCtx.createBuffer(1, Math.max(1, Math.floor(rockAudioCtx.sampleRate * 0.12)), rockAudioCtx.sampleRate);
                    const data = buf.getChannelData(0);
                    for (let i = 0; i < buf.length; i++) data[i] = Math.random() * 2 - 1;
                    noise.buffer = buf;

                    const snareGain = rockAudioCtx.createGain();
                    snareGain.gain.setValueAtTime(0.6, now);
                    snareGain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

                    noise.connect(snareGain);
                    snareGain.connect(rockAudioCtx.destination);
                    noise.start(now);
                    noise.stop(now + 0.12);
                }

                // 2. Iconic "Back in Black" Guitar Chords & Solo Fill
                if (currentStep === 0) {
                    playGuitarChord(freqE, now, 0.4); // E Chord hit 1
                } else if (currentStep === 6) {
                    playGuitarChord(freqD, now, 0.25); // D Chord hit 1
                } else if (currentStep === 8) {
                    playGuitarChord(freqD, now, 0.25); // D Chord hit 2
                } else if (currentStep === 10) {
                    playGuitarChord(freqD, now, 0.25); // D Chord hit 3
                } else if (currentStep === 12) {
                    playGuitarChord(freqA, now, 0.25); // A Chord hit 1
                } else if (currentStep === 14) {
                    playGuitarChord(freqA, now, 0.25); // A Chord hit 2
                } else if (currentStep === 16) {
                    playGuitarChord(freqA, now, 0.25); // A Chord hit 3
                } else if (currentStep >= 24 && currentStep <= 30) {
                    // Pentatonic Guitar Riff Fill
                    const noteIdx = (currentStep - 24) / 2;
                    if (Number.isInteger(noteIdx) && noteIdx < fillNotes.length) {
                        playGuitarChord([fillNotes[noteIdx]], now, 0.18);
                    }
                }

                step++;
            }, stepDuration * 1000);
        }

        function processCommand(text) {
            setState('processing');
            const cleanText = text.trim().toLowerCase();

            // Command 1: Open Google ("جارویس گوگل باز کن")
            const isGoogleCmd = cleanText.includes('گوگل') || cleanText.includes('google');
            
            // Command 2: Play Back in Black ("جارویس اهنگ back in black پخش کن")
            const isMusicPlayCmd = (cleanText.includes('اهنگ') || cleanText.includes('آهنگ') || cleanText.includes('موزیک') || cleanText.includes('پخش')) && 
                                   (cleanText.includes('پخش') || cleanText.includes('black') || cleanText.includes('بلک') || cleanText.includes('بک'));
            
            // Command 3: Stop Music ("جارویس اهنگ قطع کن")
            const isMusicStopCmd = (cleanText.includes('اهنگ') || cleanText.includes('آهنگ') || cleanText.includes('موزیک')) && 
                                   (cleanText.includes('قطع') || cleanText.includes('خاموش') || cleanText.includes('ببند') || cleanText.includes('استپ') || cleanText.includes('متوقف'));

            if (isMusicStopCmd) {
                stopBackInBlackMusic();
                const resp = "بله قربان اهنگ قطع شد";
                jarvisText.textContent = `«${resp}»`;
                speakJarvis(resp);
            }
            else if (isGoogleCmd) {
                stopBackInBlackMusic();
                const firstResp = "بله قربان";
                jarvisText.textContent = `«${firstResp}»`;
                
                // First Say "بله قربان", then open Google, then say "گوگل باز شد قربان"
                speakJarvis(firstResp, () => {
                    window.open('https://www.google.com', '_blank');
                    
                    setTimeout(() => {
                        const secondResp = "گوگل باز شد قربان";
                        jarvisText.textContent = `«${secondResp}»`;
                        speakJarvis(secondResp);
                    }, 400);
                });
            } 
            else if (isMusicPlayCmd) {
                const resp = "بله قربان اهنگ پخش شد";
                jarvisText.textContent = `«${resp}»`;
                speakJarvis(resp, () => {
                    playBackInBlackMusic();
                });
            } 
            else {
                // Fallback greeting or general guidance
                stopBackInBlackMusic();
                const defaultResp = "در خدمت شما هستم قربان. می‌توانید دستورات «گوگل باز کن»، «آهنگ Back in Black پخش کن» یا «آهنگ قطع کن» را بگویید.";
                jarvisText.textContent = `«${defaultResp}»`;
                speakJarvis(defaultResp);
            }
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'fa-IR';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                setState('listening');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userText.textContent = `«${transcript}»`;
                processCommand(transcript);
            };

            recognition.onerror = (event) => {
                console.warn('Speech recognition error:', event.error);
                statusMessage.textContent = 'دستور شنیده نشد. از دکمه‌های تست پایین نیز می‌توانید استفاده کنید.';
                setState('idle');
            };

            recognition.onend = () => {
                if (currentState === 'listening') {
                    setState('idle');
                }
            };
        } else {
            statusMessage.textContent = 'مرورگر شما از میکروفون صوتی مستقیم پشتیبانی نمی‌کند، می‌توانید از دکمه‌های شبیه‌سازی پایین استفاده کنید.';
        }

        jarvisOrb.addEventListener('click', () => {
            if (currentState === 'speaking') {
                window.speechSynthesis?.cancel();
                setState('idle');
                return;
            }

            if (currentState === 'listening') {
                if (recognition) recognition.stop();
                setState('idle');
                return;
            }

            if (recognition) {
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                    setTimeout(() => recognition.start(), 200);
                }
            } else {
                // Simulation fallback
                simulateInput("جارویس گوگل باز کن");
            }
        });

        // Test Buttons Logic
        cmdGoogleBtn.addEventListener('click', () => simulateInput("جارویس گوگل باز کن"));
        cmdMusicBtn.addEventListener('click', () => simulateInput("جارویس اهنگ black in black پخش کن"));
        cmdStopMusicBtn.addEventListener('click', () => simulateInput("جارویس اهنگ قطع کن"));

        function simulateInput(text) {
            if (currentState === 'speaking') {
                window.speechSynthesis?.cancel();
            }
            userText.textContent = `«${text}» (دستور دکمه تست)`;
            processCommand(text);
        }

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.alpha = Math.random() * 0.6 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.fillStyle = `rgba(6, 182, 212, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 50; i++) {
            particles.push(new Particle());
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // Initial launch state
        setState('idle');
    </script>
</body>
</html>
